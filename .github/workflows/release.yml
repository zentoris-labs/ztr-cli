name: release

on:
  push:
    tags:
      - "v*"
  # Manual dry-run: build + sign the artifacts without publishing, to validate the release
  # pipeline (notably cosign signing, which only runs with CI OIDC) before cutting a real tag.
  workflow_dispatch: {}

permissions:
  contents: write # create the GitHub Release and upload artifacts
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      # cosign (keyless signing) and syft (SBOM generation) must be on PATH for the
      # `signs` / `sboms` sections of .goreleaser.yaml. cosign is intentionally unpinned: the
      # goreleaser-action verifies its own binary with cosign's new bundle format, so it needs a
      # current cosign - which is why our signing also uses the bundle format (see .goreleaser.yaml).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          # A tag push does a real release; a manual run is a dry-run that signs but publishes
          # nothing (and skips the require-a-clean-tag validation), so signing can be verified.
          args: ${{ github.ref_type == 'tag' && 'release --clean' || 'release --clean --skip=publish,validate' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
